# Diretórios de trabalho com permissões conservadoras.
# /etc fica sob controle de root; o serviço apenas lê arquivos do grupo ollama-grid.
d /var/lib/ollama-grid 0750 ollama-grid ollama-grid -
d /var/log/ollama-grid 0750 ollama-grid ollama-grid -
d /etc/ollama-grid     0750 root        ollama-grid -
