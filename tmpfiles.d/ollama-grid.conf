# Diretorios estruturais root:root, dados de usuario isolados.
# Nenhum diretorio gravavel pelo servico contem componentes root-owned.
d /var/lib/ollama-grid 0755 root root -
d /var/log/ollama-grid 0755 root root -
d /etc/ollama-grid 0750 root ollama-grid -

# Modelos compartilhados; diretorios intermediarios por backend.
d /var/lib/ollama-grid/models 0750 ollama-grid ollama-grid -
d /var/lib/ollama-grid/cpu 0755 root root -
d /var/lib/ollama-grid/vulkan 0755 root root -
d /var/lib/ollama-grid/rocm 0755 root root -
d /var/lib/ollama-grid/cuda12 0755 root root -
d /var/lib/ollama-grid/cuda13 0755 root root -

# Homes gravaveis pelo usuario do servico.
d /var/lib/ollama-grid/cpu/home 0750 ollama-grid ollama-grid -
d /var/lib/ollama-grid/vulkan/home 0750 ollama-grid ollama-grid -
d /var/lib/ollama-grid/rocm/home 0750 ollama-grid ollama-grid -
d /var/lib/ollama-grid/cuda12/home 0750 ollama-grid ollama-grid -
d /var/lib/ollama-grid/cuda13/home 0750 ollama-grid ollama-grid -

# Logs por backend gravaveis pelo usuario do servico.
d /var/log/ollama-grid/cpu 0750 ollama-grid ollama-grid -
d /var/log/ollama-grid/vulkan 0750 ollama-grid ollama-grid -
d /var/log/ollama-grid/rocm 0750 ollama-grid ollama-grid -
d /var/log/ollama-grid/cuda12 0750 ollama-grid ollama-grid -
d /var/log/ollama-grid/cuda13 0750 ollama-grid ollama-grid -
