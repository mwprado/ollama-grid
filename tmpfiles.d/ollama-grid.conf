# A estrutura base deve ser controlada por root. Isso evita transicoes
# inseguras de proprietario em diretorios intermediarios durante tmpfiles.
# Apenas os dados do servico (models e homes) pertencem a ollama-grid.
d /var/lib/ollama-grid 0755 root root -
d /var/log/ollama-grid 0755 root root -
d /etc/ollama-grid 0750 root ollama-grid -

# Os modelos sao compartilhados por todos os backends.
d /var/lib/ollama-grid/models 0750 ollama-grid ollama-grid -

# Homes isoladas por backend (conforme os arquivos /etc/ollama-grid/*.conf).
d /var/lib/ollama-grid/cpu/home    0750 ollama-grid ollama-grid -
d /var/lib/ollama-grid/vulkan/home 0750 ollama-grid ollama-grid -
d /var/lib/ollama-grid/rocm/home   0750 ollama-grid ollama-grid -
d /var/lib/ollama-grid/cuda12/home 0750 ollama-grid ollama-grid -
d /var/lib/ollama-grid/cuda13/home 0750 ollama-grid ollama-grid -

# Compatibilidade com a estrutura cuda usada por pacotes anteriores.
d /var/lib/ollama-grid/cuda/home   0750 ollama-grid ollama-grid -
