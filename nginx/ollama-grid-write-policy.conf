# Ollama-Grid write policy
#
# CPU = backend responsável por todas as alterações no model store.
# Todos os backends compartilham:
#
#   /var/lib/ollama-grid/models
#
# Portanto operações de escrita solicitadas através de Vulkan/ROCm/CUDA
# são executadas pelo backend CPU.

# --------------------------------------------------
# Vulkan -> CPU para operações de model store
# --------------------------------------------------

location ~ ^/vulkan(/api/(pull|create|copy|delete|push))$ {
    rewrite ^/vulkan(.*)$ $1 break;

    add_header X-Ollama-Grid-Backend cpu-write always;
    proxy_pass http://ollama_grid_cpu;
}

location ~ ^/vulkan(/api/blobs/.*)$ {
    rewrite ^/vulkan(.*)$ $1 break;

    add_header X-Ollama-Grid-Backend cpu-write always;
    proxy_pass http://ollama_grid_cpu;
}


