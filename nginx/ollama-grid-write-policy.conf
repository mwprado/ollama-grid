# Ollama-Grid write policy
#
# CPU = backend responsável por todas as alterações no model store.
# Todos os backends compartilham:
#
#   /var/lib/ollama-grid/models
#
# Portanto operacoes de escrita solicitadas pela rota padrao /api/ ou
# atraves de Vulkan/ROCm/CUDA sao executadas pelo backend CPU.
# Essa politica centraliza o escritor, mas nao substitui as garantias de
# atomicidade, locks e finalizacao de blobs/manifests do Ollama.

# --------------------------------------------------
# API padrao /api/ -> CPU para operacoes de model store
# Regex deliberadamente restrita aos endpoints de escrita.
# --------------------------------------------------

location ~ ^/api/(pull|create|copy|delete|push)$ {
    add_header X-Ollama-Grid-Backend cpu-write always;
    proxy_pass http://ollama_grid_cpu;
}

location ~ ^/api/blobs/.*$ {
    add_header X-Ollama-Grid-Backend cpu-write always;
    proxy_pass http://ollama_grid_cpu;
}

# --------------------------------------------------
# Vulkan -> CPU para operações de model store
# --------------------------------------------------

location ~ ^/vulkan(/api/(pull|create|copy|delete|push))$ {
    rewrite ^/vulkan(.*)$ $1 break;

    add_header X-Ollama-Grid-Backend cpu-write always;
    proxy_pass http://ollama_grid_cpu;
}

location ~ ^/vulkan(/api/blobs/.*)$ {
    rewrite ^/vulkan(.*)$ $1 break;

    add_header X-Ollama-Grid-Backend cpu-write always;
    proxy_pass http://ollama_grid_cpu;
}


