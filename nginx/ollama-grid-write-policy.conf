# Ollama-Grid write policy
#
# CPU = único backend autorizado a alterar o model store.
# Vulkan / ROCm / CUDA12 / CUDA13 = read-only pela API pública.

# -----------------------------
# Vulkan: bloquear operações RW
# -----------------------------
location = /vulkan/api/pull   { return 403; }
location = /vulkan/api/create { return 403; }
location = /vulkan/api/copy   { return 403; }
location = /vulkan/api/delete { return 403; }

location ~ ^/vulkan/api/blobs/ {
    if ($request_method = POST) {
        return 403;
    }

    add_header X-Ollama-Grid-Backend vulkan always;
    proxy_pass http://ollama_grid_vulkan;
}

