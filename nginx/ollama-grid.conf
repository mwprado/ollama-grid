# /etc/nginx/conf.d/ollama-grid.conf
#
# OllamaGrid v1: roteamento explícito por backend.
#
# Semântica:
#   /api/...        -> backend padrão (CPU, por segurança operacional)
#   /cpu/api/...    -> ollama-grid@cpu
#   /vulkan/api/... -> ollama-grid@vulkan
#   /rocm/api/...   -> ollama-grid@rocm
#   /cuda/api/...   -> ollama-grid@cuda
#   /cuda12/api/... -> ollama-grid@cuda12
#
# Observação: os backends devem escutar em 127.0.0.1 por padrão. Exposição externa
# deve ser feita pelo Nginx, preferencialmente com TLS e autenticação/rate limit.

upstream ollama_grid_cpu {
    server 127.0.0.1:11434;
    keepalive 32;
}

upstream ollama_grid_vulkan {
    server 127.0.0.1:11435;
    keepalive 32;
}

upstream ollama_grid_rocm {
    server 127.0.0.1:11436;
    keepalive 32;
}

upstream ollama_grid_cuda12 {
    server 127.0.0.1:11437;
    keepalive 32;
}

upstream ollama_grid_cuda {
    server 127.0.0.1:11438;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;

    client_max_body_size 0;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_connect_timeout 60s;
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Backend padrão: CPU. Mantém /api/... compatível com clientes Ollama simples.
    location / {
        proxy_pass http://ollama_grid_cpu;
    }

    # Rotas explícitas por backend. O uso de proxy_pass com barra final remove o
    # prefixo do location antes de repassar ao Ollama.
    location /cpu/ {
        proxy_pass http://ollama_grid_cpu/;
    }

    location /vulkan/ {
        proxy_pass http://ollama_grid_vulkan/;
    }

    location /rocm/ {
        proxy_pass http://ollama_grid_rocm/;
    }

    location /cuda12/ {
        proxy_pass http://ollama_grid_cuda12/;
    }

    location /cuda/ {
        proxy_pass http://ollama_grid_cuda/;
    }
}
