# /etc/nginx/conf.d/ollama-grid.conf
#
# OllamaGrid v1: proxy transparente + seleção explícita opcional.
#
# Objetivo principal:
#   manter /api/... compatível com clientes Ollama sem alterar o caminho.
#
# Rotas transparentes:
#   /api/...        -> backend padrão (CPU por segurança operacional)
#
# Rotas explícitas opcionais para diagnóstico/seleção manual:
#   /cpu/api/...    -> CPU
#   /vulkan/api/... -> Vulkan
#   /rocm/api/...   -> ROCm
#   /cuda12/api/... -> CUDA 12.9 legado
#   /cuda/api/...   -> CUDA atual
#
# As rotas explícitas removem o prefixo antes de repassar ao Ollama. Exemplo:
#   /cuda/api/version -> http://127.0.0.1:11438/api/version
#
# Observação: os backends devem escutar em 127.0.0.1 por padrão. Exposição externa
# deve ser feita pelo Nginx, preferencialmente com TLS e autenticação/rate limit.

upstream ollama_grid_cpu {
    server 127.0.0.1:11434;
    keepalive 32;
}

upstream ollama_grid_vulkan {
    server 127.0.0.1:11435;
    keepalive 32;
}

upstream ollama_grid_rocm {
    server 127.0.0.1:11436;
    keepalive 32;
}

upstream ollama_grid_cuda12 {
    server 127.0.0.1:11437;
    keepalive 32;
}

upstream ollama_grid_cuda {
    server 127.0.0.1:11438;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;

    client_max_body_size 0;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_connect_timeout 60s;
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        add_header Content-Type text/plain;
        add_header X-Ollama-Grid-Backend default-cpu always;
        return 200 "ok default-cpu\n";
    }

    # Transparente para clientes Ollama: /api/... permanece /api/...
    location / {
        add_header X-Ollama-Grid-Backend default-cpu always;
        proxy_pass http://ollama_grid_cpu;
    }

    # Seleção explícita por backend. A barra final em proxy_pass remove o prefixo
    # do location antes de repassar ao Ollama.
    location /cpu/ {
        add_header X-Ollama-Grid-Backend cpu always;
        proxy_pass http://ollama_grid_cpu/;
    }

    location /vulkan/ {
        add_header X-Ollama-Grid-Backend vulkan always;
        proxy_pass http://ollama_grid_vulkan/;
    }

    location /rocm/ {
        add_header X-Ollama-Grid-Backend rocm always;
        proxy_pass http://ollama_grid_rocm/;
    }

    # Manter /cuda12/ antes de /cuda/ evita ambiguidade visual e facilita leitura.
    location /cuda12/ {
        add_header X-Ollama-Grid-Backend cuda12 always;
        proxy_pass http://ollama_grid_cuda12/;
    }

    location /cuda/ {
        add_header X-Ollama-Grid-Backend cuda always;
        proxy_pass http://ollama_grid_cuda/;
    }
}
