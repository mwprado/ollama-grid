# /etc/nginx/conf.d/ollama-grid.conf

# --- Pool de backends (adicione/remova conforme seus serviços locais/remotos) ---
upstream ollama_nodes {
    # Round-robin por padrão
    server 127.0.0.1:11434;   # CPU (principal)
    # server 127.0.0.1:11435; # Vulkan
    # server 127.0.0.1:11436; # ROCm
    # server 127.0.0.1:11437; # CUDA
    keepalive 64;
}

# Suporte a WebSocket/HTTP upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # Altere a porta se quiser expor externamente (ex.: 80/443 com TLS)
    listen 8080;

    # Opcional: restrinja a origem (CORS) se acessar via browser
    # add_header Access-Control-Allow-Origin "*" always;
    # add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    # add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    # if ($request_method = OPTIONS) { return 204; }

    # Requisições podem ser longas (downloads de modelo, geração streaming)
    client_max_body_size 0;             # sem limite
    proxy_read_timeout   1h;
    proxy_send_timeout   1h;

    # Streaming sem buffering (baixa latência)
    proxy_buffering off;
    proxy_request_buffering off;

    # Cabeçalhos para manter HTTP/1.1 e WebSocket
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Cabeçalhos usuais
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Healthcheck simples
    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Rota padrão para o Ollama
    location / {
        proxy_pass http://ollama_nodes;
    }
}
